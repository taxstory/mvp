[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Security headers (Phase 2) ────────────────────────────────────────────────────────────────────────────
# The CSP is REPORT-ONLY until it has been exercised in staging: open every screen (incl. the client viewer, video
# render, Stripe redirect) with the browser console open, fix anything it reports, then rename the header to
# Content-Security-Policy to enforce it.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.posthog.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Pages whose URL carries a bearer token (share link / client portal): never leak it via Referer, never cache, never index.
[[headers]]
  for = "/view/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control   = "no-store"
    X-Robots-Tag    = "noindex, nofollow, noarchive"

[[headers]]
  for = "/portal/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    Cache-Control   = "no-store"
    X-Robots-Tag    = "noindex, nofollow, noarchive"

# Fail and refund audio jobs that can no longer finish (idempotent; also invoked opportunistically when a user starts a job).
[functions."reap-jobs"]
  schedule = "*/10 * * * *"

# Backstop for permanent deletion: remove files whose return no longer exists (idempotent).
[functions."sweep-orphans"]
  schedule = "17 3 * * *"
