[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Install function dependencies before bundling
[build.environment]
  NODE_VERSION = "18"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# Explicit function config — tells Netlify to bundle with esbuild
# and install the functions/package.json deps
[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/node_modules/**"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
